{% extends "base.html" %}
{% block content %}
<main class="archive">
  <h1 class="archive-title">记录</h1>
  <section class="archive-list" aria-label="全部记录">
    {% for post in posts %}
    <a class="archive-row" href="{{ post.url }}">
      <h2>{{ post.title }}</h2>
    </a>
    {% endfor %}
  </section>
</main>
{% endblock %}
