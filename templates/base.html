<!doctype html>
<html lang="{{ site.language }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ description }}">
  <meta name="color-scheme" content="dark">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ page_title }}">
  <meta property="og:description" content="{{ description }}">
  <meta property="og:url" content="{{ canonical }}">
  <meta property="og:image" content="{{ site.url }}/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="{{ canonical }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="/feed.xml">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/style.css">
  <title>{{ page_title }}</title>
</head>
<body data-comments-api="{{ site.comments_api }}">
  <header class="masthead">
    <a class="name" href="/">{{ site.title }}</a>
    <nav aria-label="主导航">
      <a href="/">记录</a>
      <a href="/account/">讨论账户</a>
      <a href="/feed.xml">RSS</a>
      <a href="{{ site.github_url }}">GitHub ↗</a>
    </nav>
  </header>

  {% block content %}{% endblock %}

  <footer>
    <span>{{ site.author }} / somewhere in Asia</span>
    <span>No analytics. No newsletter. <a href="/feed.xml">RSS</a></span>
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
